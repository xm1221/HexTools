name: Build and deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # https://github.com/actions/setup-node/issues/904#issuecomment-2670963061
      - run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build app
        run: yarn build

      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping Cloudflare Pages deploy."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.credentials.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ab2343f4691dfe98689e375fc23d4121
          command: pages deploy dist --project-name=hextools --branch=main --commit-dirty=true

      # pages.dev updates immediately. hextools.xm1221.cn is proxied by the
      # xm1221.cn zone, which can keep the previous index.html until purged.
      - name: Purge custom domain HTML cache
        if: steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          zone_id=$(curl -fsS "https://api.cloudflare.com/client/v4/zones?name=xm1221.cn" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq -r '.result[0].id // empty')
          if [ -z "${zone_id}" ]; then
            echo "::warning::Could not look up zone xm1221.cn. Purge https://hextools.xm1221.cn/ in the dashboard. The token may be missing Zone Read."
            exit 0
          fi
          response=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://hextools.xm1221.cn/","https://hextools.xm1221.cn/index.html"]}')
          echo "${response}"
          if [ "$(echo "${response}" | jq -r '.success')" != "true" ]; then
            echo "::warning::Cache purge was rejected. Purge https://hextools.xm1221.cn/ manually, and add Zone.Cache Purge to the API token."
            exit 0
          fi
